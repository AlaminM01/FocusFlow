name: focusflow
description: "FocusFlow - Premium Distraction-Free Productivity Workspace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database (Offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI / Design & Animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  animated_text_kit: ^4.2.3
  shimmer: ^3.0.0
  percent_indicator: ^4.2.5
  fl_chart: ^1.1.1
  cupertino_icons: ^1.0.8

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
